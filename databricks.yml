# This is a Declarative Automation Bundle definition for test_dab_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: test_dab_project
  uuid: 48f49919-5ccb-4931-9119-ee650757b478

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  workspace_host:
    description: my workspace host url 

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: ${workspace_host}
    variables:
      catalog: practice
      schema: ${workspace.current_user.short_name}
  # prod:
  #   mode: production
  #   default: false
  #   workspace:
  #     host: http://127.0.0.1:7073
  #     # We explicitly deploy to /Workspace/Users/snehaldighore87@gmail.com to make sure we only have a single copy.
  #     root_path: /Workspace/Users/snehaldighore87@gmail.com/.bundle/${bundle.name}/${bundle.target}
  #   variables:
  #     catalog: practice
  #     schema: prod
  #   permissions:
  #     - user_name: snehaldighore87@gmail.com
  #       level: CAN_MANAGE

resources:
  jobs:
    my_scheduled_job:
      name: "utilsTestProject_Pipeline"
    
      
      # 1. Define the computing power (Cluster)
      new_cluster:
        spark_version: "14.3.x-scala2.12" # Choose the LTS runtime you need
        node_type_id: "Standard_D3_v2"    # Cloud provider specific instance type
        num_workers: 1

      # 2. Point to the task/notebook to execute
      tasks:
        - task_key: how_to_get_pipeline_parameters
          notebook_task:
            # Looks for a notebook named 'main_script.ipynb' or 'main_script.py' in your src folder
            notebook_path: ./src/how_to_get_pipeline_parameters.ipynb 
            base_parameters: 
              "a" : "9"
              "b": "10"
              "current_tp" : "{{job.start_time.iso_datetime}}"

      # 3. Set the schedule (Uses Cron syntax)
      schedule:
        quartz_cron_expression: "53 1 * * * ?" # Runs every single hour in a day 
        timezone_id: "UTC"
        pause_status: "PAUSED" 